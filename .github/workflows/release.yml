name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true
      - name: build
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          go vet ./...
          go test ./...
          go build -trimpath -ldflags="-s -w" -o dist/scoria.exe ./cmd/scoria
          go run ./tools/imports dist/scoria.exe > dist/IMPORTS.txt
          $hash = (Get-FileHash -Algorithm SHA256 dist/scoria.exe).Hash.ToLower()
          [IO.File]::WriteAllText("dist/SHA256SUMS", "$hash  scoria.exe`n", [Text.Encoding]::ASCII)
      - name: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/scoria.exe dist/SHA256SUMS dist/IMPORTS.txt --generate-notes
