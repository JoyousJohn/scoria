name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true
      - name: build
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags="-s -w" -o dist/scoria.exe ./cmd/scoria
      - name: format, vet, and test
        shell: pwsh
        run: |
          $diff = gofmt -l .
          if ($diff) {
            $diff
            throw "gofmt required"
          }
          go vet ./...
          go test ./...
      - name: source write-API tripwire
        shell: pwsh
        run: |
          $patterns = @('DeleteFile', 'MoveFile', 'SHFileOperation', 'NtSetInformationFile', 'RegDeleteKey', 'GENERIC_WRITE')
          $hits = Get-ChildItem cmd, internal -Recurse -Filter *.go |
            Select-String -SimpleMatch -Pattern $patterns
          if ($hits) {
            $hits
            throw "forbidden write-capable symbol in cmd/ or internal/"
          }
      - name: import-table tripwire
        shell: pwsh
        run: |
          $imports = go run ./tools/imports dist/scoria.exe
          $bad = @('DeleteFile', 'MoveFile', 'SHFileOperation', 'NtSetInformationFile', 'RegDeleteKey')
          foreach ($name in $bad) {
            if ($imports -match [regex]::Escape($name)) {
              throw "forbidden import: $name"
            }
          }
